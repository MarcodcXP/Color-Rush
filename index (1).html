 prof(){const L=pl(),a=xpb(L),n=xpn(L),Q=sv.stt,k=SK[sv.skin],R=(x,y)=>`<div class=li><span>${x}</span><span>${y}</span></div>`;
  return hd('PROFILE')+`<div class=card style="text-align:center">${cvs(sv.skin,0,96)}<h2>${sv.name}</h2><div class=tag>${TT[sv.title][0]} · ${rank()}</div><div style="font-size:28px;margin:6px 0;min-height:34px">${sv.bdg.map(id=>BG.find(b=>b[0]===id)[1]).join(' ')||'—'}</div><button class="b sm ghost" data-a=name>✎ Cambiar nombre</button><div class=tag style="margin-top:10px">PLAYER LEVEL ${L}</div>${bar(sv.xp-a,n-a)}<div class=tag>${sv.xp-a} / ${n-a} XP</div></div>
  <div class=card>${R('Skin',k.n)+R('Estrellas','★ '+stars()+' / '+MAXS)+R('Logros',sv.ach.length+' / '+AC.length)+R('Skins',sv.skins.length+' / '+SK.length)+R('Niveles',done()+' / '+LV.length)+R('Mejor puntuación',sv.best)+R('Mayor combo','x'+Q.bc)}</div>
  <div class=card><div class=tag>TÍTULO</div><div class=row>${TT.map((t,i)=>ttOk(i)?`<button class="b sm${sv.title===i?'':' ghost'}" data-a=title:${i}>${t[0]}</button>`:'').join('')}</div><div class=tag style="margin-top:10px">BADGES (${sv.bdg.length}/3)</div><div class=row>${BG.map(b=>hasA(b[0])?`<button class="b sm${sv.bdg.includes(b[0])?'':' ghost'}" data-a=bdg:${b[0]}>${b[1]} ${b[2]}</button>`:'').join('')||'<span>Desbloquea logros para conseguir badges</span>'}</div></div>`},
 stats(){const Q=sv.stt,E=sv.ex,t=Q.pl,bsc=Math.max(sv.best,...Object.values(sv.bm),...Object.values(E.bestScores)),R=(l,v,b,m)=>`<div style="padding:7px 0;border-bottom:1px dashed var(--ln);font-weight:700"><div style="display:flex;justify-content:space-between"><span>${l}</span><span>${v}</span></div>${m?bar(b,m):''}</div>`;
  return hd('STATS')+`<div class=card>${R('Rank',rank())+R('Total Score',Q.ts)+R('Best Score',bsc)+R('Total Games',Q.g)+R('Levels Completed',done()+' / '+LV.length,done(),LV.length)+R('Perfect Levels',lvc()+' / '+LV.length,lvc(),LV.length)+R('Stars','★ '+stars()+' / '+MAXS,stars(),MAXS)+R('Coins Earned','🪙 '+Q.ce)+R('XP Earned',Q.xe)+R('Highest Combo','x'+Q.bc,Math.min(Q.bc,50),50)+R('Colors Changed',Q.sw)+R('Skins Owned',sv.skins.length+' / '+SK.length,sv.skins.length,SK.length)+R('Achievements',sv.ach.length+' / '+AC.length,sv.ach.length,AC.length)+R('Play Time',Math.floor(t/3600)+'h '+Math.floor(t%3600/60)+'m')}</div>`},
 prog(){dmDay();const L=pl(),a=xpb(L),n=xpn(L),dn=DM.filter(m=>sv.dm.cl.includes(m.id)).length,nb=SK.filter((s,i)=>s.k==='coins'&&!own('skin',i)&&reqOk(s)).sort((x,y)=>x.v-y.v)[0],P=(l,v,m,x)=>`<div class=card><div class=li style="border:0"><span>${l}</span><span>${x||v+' / '+m}</span></div>${bar(v,m)}</div>`;
  return hd('PROGRESS')+chips()+P('LEVEL',L,MAXL)+P('XP',Math.min(sv.xp-a,n-a),n-a,(sv.xp-a)+' / '+(n-a)+' XP')+P('EXTREMES',done(),LV.length)+P('STARS',stars(),MAXS)+P('ACHIEVEMENTS',sv.ach.length,AC.length)+P('SKINS',sv.skins.length,SK.length)+(nb?P('COINS → '+nb.n,Math.min(sv.coins,nb.v),nb.v,'🪙 '+sv.coins+' / '+nb.v):P('COINS',1,1,'🪙 '+sv.coins))+P('MISSIONS',dn,DM.length)+`<div class=card><div class=tag>PRÓXIMOS OBJETIVOS</div>${goals().map(g=>`<div class=li><span>${g}</span></div>`).join('')}</div>`},
 lb(){return hd('LEADERBOARD')+`<div class=card>${sv.lb.length?sv.lb.map((e,i)=>`<div class=li><span>${i+1}. ${e.n} <small>${e.r} · ${e.m}</small></span><span>${e.s}</span></div>`).join(''):'<p>Juega para aparecer aquí.</p>'}</div>`},
 set(){const t=(k,l)=>`<button class="b ghost" data-a=ts:${k}>${l}: ${sv.set[k]?'ON':'OFF'}</button>`,sl=(k,l)=>`<label class=sl>${l}<input type=range min=0 max=100 value=${sv.set[k]} data-r=${k}></label>`;
  return hd('SETTINGS')+`<div class=card style="display:grid;gap:10px;justify-items:center"><div class=tag>AUDIO</div><button class="b ghost" data-a=tog:snd>Sonido: ${sv.snd?'ON':'OFF'}</button>${sl('vol','Master')}${sl('mus','Music')}${sl('sfx','Sound effects')}
  <div class=tag>GAMEPLAY</div>${t('shake','Screen shake')}<button class="b ghost" data-a=part>Partículas: ${['OFF','BAJAS','ALTAS'][sv.set.part]}</button>${t('pause','Auto pause')}<button class="b ghost" data-a=tog:vib>Vibración: ${sv.vib?'ON':'OFF'}</button>
  <div class=tag>ACCESIBILIDAD</div>${t('rm','Reduced motion')}${t('cb','Colorblind (símbolos grandes)')}<div class=tag>CONTROLES</div><p style="font-size:14px;margin:0">Teclado: A/D, ← →, Espacio · Táctil: toca izquierda/derecha</p>
  <button class="b ghost" data-a=rset>RESET SETTINGS</button><button class="b ghost" data-a=reset>Borrar progreso</button>
  ${location.hash==='#debug'?'<div class=tag>DEBUG</div><button class="b sm" data-a=dbg:u>Unlock all</button><button class="b sm" data-a=dbg:t>+500 monedas</button><button class="b sm" data-a=dbg:x>+500 XP</button><button class="b sm" data-a=dbg:s>+3★ siguientes 5</button>':''}</div>`}
};
const MS=[...[5,10,15,20,25,30,40,50].map(n=>({id:'l'+n,c:'rew',t:n+' niveles completados',f:done,m:n,r:{tok:n*30,xp:n*8}})),...[25,50,75,100,125,150].map(n=>({id:'s'+n,c:'rew',t:n+' ★ estrellas',f:stars,m:n,r:{tok:n*8,xp:n*6}})),
 {id:'m1',c:'mis',t:'Completa 5 niveles Extreme',f:done,m:5,r:{tok:100}},{id:'m2',c:'mis',t:'Consigue 10 estrellas Extreme',f:stars,m:10,r:{tok:100}},{id:'m3',c:'mis',t:'3 ★ en 3 niveles',f:lvc,m:3,r:{tok:150}},{id:'m4',c:'mis',t:'Completa un nivel sin errores',f:()=>sv.perf,m:1,r:{tok:100}},{id:'m5',c:'mis',t:'Completa 10 niveles Extreme',f:done,m:10,r:{tok:200}}];
const rtxt=r=>'🪙 '+(r.tok||0)+(r.xp?' · '+r.xp+' XP':'');
function msList(c,p){return MS.filter(m=>m.c===c&&(!p||m.id[0]===p)).map(m=>{const v=Math.min(m.f(),m.m),cl=sv.rewards.includes(m.id),it=[['skin','SKIN'],['trail','TRAIL'],['fx','EFFECT'],['theme','THEME']].flatMap(([k,l])=>CATS[k].filter(i=>i.k==='M'&&i.v===m.id).map(i=>l+': '+i.n));
 return `<div class=card><div class=li style="border:0"><span>${m.t}</span><span>${rtxt(m.r)}${it.length?' · 🎁 '+it.join(', '):''}</span></div><div class=bar><i style="width:${v/m.m*100}%"></i></div><div class=li style="border:0"><span>${v} / ${m.m}</span>${cl?'<span>✓ RECLAMADA</span>':v>=m.m?`<button class="b green sm" data-a=claim:${m.id}>RECLAMAR</button>`:'<span>🔒</span>'}</div></div>`}).join('')}
function toast(t){const e=$('#tt');e.textContent=t;e.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>e.classList.remove('on'),2200)}
ui.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;aud();sUI();const[a,p,q]=b.dataset.a.split(':');
 if(a==='go')go(p);else if(a==='shop')go('shop',p);else if(a==='back')go(st==='pause'?'pause':stack.pop()||'home');
 else if(a==='play')go('modes');else if(a==='mode')startRun(null,p);else if(a==='lvl')go('lvl',+p);
 else if(a==='start'){const l=LV[p-1];if(l&&unl(l.id))startRun(l)}
 else if(a==='restart')startRun(lv,mode);else if(a==='resume')resume();else if(a==='quit')go('home');else if(a==='flt'){flt=p;render()}
 else if(a==='eq'){equip(p,+q);just=p+q;sBuy();toast('EQUIPPED');save();render()}
 else if(a==='buy'){const it=CATS[p][q];if(!reqOk(it))toast('Requisito: nivel '+(it.rq.lv||0)+' · '+(it.rq.st||0)+'★');else if(sv.coins<it.v)toast('Te faltan '+(it.v-sv.coins)+' 🪙');else{sv.coins-=it.v;(p==='skin'?sv.skins:sv.own[p]).push(+q);equip(p,+q);just=p+q;sBuy();toast('¡UNLOCKED!');checkAch();save()}render()}
 else if(a==='claim'){const m=MS.find(x=>x.id===p);if(m&&!sv.rewards.includes(p)&&m.f()>=m.m){sv.rewards.push(p);sv.tokens+=m.r.tok||0;sv.stt.ce+=m.r.tok||0;addXP(m.r.xp||30);checkAch();save();sWin();toast('Recompensa: '+rtxt(m.r))}render()}
 else if(a==='dclaim'){const m=DM.find(x=>x.id===p);if(m&&!sv.dm.cl.includes(p)&&(sv.dm.c[m.k]||0)>=m.m){sv.dm.cl.push(p);sv.coins+=m.c;sv.stt.ce+=m.c;addXP(m.x);save();sWin();toast('+'+m.c+' 🪙 · +'+m.x+' XP')}render()}
 else if(a==='tog'){sv[p]=sv[p]?0:1;save();render()}else if(a==='ts'){sv.set[p]=sv.set[p]?0:1;save();render()}else if(a==='part'){sv.set.part=(sv.set.part+2)%3;save();render()}
 else if(a==='af'){aflt=p;render()}else if(a==='title'){sv.title=+p;sBuy();save();render()}
 else if(a==='bdg'){const i=sv.bdg.indexOf(p);if(i>=0)sv.bdg.splice(i,1);else if(sv.bdg.length<3)sv.bdg.push(p);else toast('Máximo 3 badges');save();render()}
 else if(a==='rset'){sv.set=clone(D.set);save();render()}
 else if(a==='rnd'){const h=Math.random()*360;sv.cl={b:hx(h,55,45),s:hx(h+30,70,85),p:hx(h+60,80,60),t:hx(h-30,70,65),a:hx(h+15,80,75),e:hx(h+180,60,65)};save();render()}
 else if(a==='name'){const n=prompt('Nombre',sv.name);if(n){sv.name=n.slice(0,12).toUpperCase();save()}render()}
 else if(a==='reset'){if(confirm('¿Borrar todo el progreso?')){sv=clone(D);mig({});save();applyTheme();render()}}
 else if(a==='dbg'){if(p==='u')LV.forEach(l=>{if(!sv.ex.stars[l.id])sv.ex.stars[l.id]=1});if(p==='t')sv.coins+=500;if(p==='x')addXP(500);if(p==='s')LV.filter(l=>sv.ex.stars[l.id]!==3).slice(0,5).forEach(l=>sv.ex.stars[l.id]=3);save();render()}
});
ui.addEventListener('input',e=>{const t=e.target;if(t.dataset.k){sv.cl[t.dataset.k]=t.value;save();paint()}else if(t.dataset.r){sv.set[t.dataset.r]=+t.value;save()}});
function pause(){if(st==='play'){st='pause';save();go('pause')}}
function resume(){if(st==='pause'){ui.classList.remove('on');$('#pbtn').classList.add('on');st='play';last=performance.now()}}
addEventListener('keydown',e=>{const k=e.key.toLowerCase();aud();if(['arrowleft','arrowright','arrowup','arrowdown',' '].includes(k))e.preventDefault();if(e.repeat)return;
 if(st==='play'){if(k==='a'||k==='arrowleft')sw(-1);else if(['d','arrowright',' ','arrowup','arrowdown','w','s'].includes(k))sw(1);else if(k==='p'||k==='escape')pause()}
 else if(st==='pause'&&(k==='p'||k==='escape'||k==='enter'))resume()});
cv.addEventListener('pointerdown',e=>{e.preventDefault();aud();if(st==='play')sw(e.clientX<W/2?-1:1)});
$('#pbtn').onclick=pause;document.addEventListener('visibilitychange',()=>{if(document.hidden&&sv.set.pause)pause()});
addEventListener('pagehide',save);setInterval(()=>{if(st!=='play'&&ui.classList.contains('on')&&!document.hidden&&!sv.set.rm&&ui.querySelector('canvas[data-ki]'))paint()},100);
applyTheme();checkAch();go('home');requestAnimationFrame(loop);
})();
</script></body></html>
